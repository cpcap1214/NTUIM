server {
    listen 80;
    server_name ntu.im;

    # 重定向到 HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ntu.im;

    # SSL 憑證設定 (使用 Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/ntu.im/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ntu.im/privkey.pem;
    
    # SSL 安全設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # 安全規則：禁止存取版本控制目錄和敏感檔案
    location ~ /\.(git|hg|svn)/ {
        deny all;
        return 404;
    }

    location ~ /\.(env|htaccess|htpasswd)$ {
        deny all;
        return 404;
    }

    location ~ /(config|includes|misc|modules|profiles|scripts|themes|INSTALL|README|LICENSE)/ {
        deny all;
        return 404;
    }

    # 前端靜態檔案
    location / {
        root /var/www/ntuim/build;
        try_files $uri $uri/ /index.html;
        index index.html;
        
        # 快取設定
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 後端 API
    location /api/ {
        proxy_pass http://localhost:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # 增加檔案上傳大小限制
        client_max_body_size 10M;
    }

    # ⚠️ 已移除：原本這裡用 alias 把整個 uploads 目錄公開，任何人都能直接下載
    # 考古題 PDF，完全繞過「需繳交系學會費」的限制（後端的 express.static 也已一併移除）。
    #
    # 檔案改為只能透過有認證的 API 端點取得（後端會自行讀檔並串流回應）：
    #   /api/exams/:id/preview|download/...
    #   /api/cheat-sheets/:id/preview|download
    # 這些路徑會走下方的 /api/ proxy，不需要 nginx 直接服務檔案。
    #
    # 若之後要恢復靜態服務以提升效能，必須改用 X-Accel-Redirect（internal location），
    # 由後端驗證權限後再指示 nginx 送檔，不可再直接對外開放目錄。
    location /uploads/ {
        deny all;
        return 403;
    }

    # 安全標頭
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}